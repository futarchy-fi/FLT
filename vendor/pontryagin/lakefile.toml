name = "pontryagin"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.flexible = true
weak.linter.mathlibStandardSet = true
warn.sorry = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d9ed2b07e3d851ae48dbfe62550f6da9a1c128c9"

[[lean_lib]]
name = "Pontryagin"
globs = ["Pontryagin"]

[lean_lib.leanOptions]
weak.linter.style.haveILetI = false
# Mathlib v4.34 enables this style linter, but the vendored headers follow their upstream layout.
weak.linter.style.header = false
weak.linter.deprecated = false
