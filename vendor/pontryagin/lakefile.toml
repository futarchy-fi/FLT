name = "pontryagin"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.flexible = true
weak.linter.mathlibStandardSet = true
warn.sorry = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "bc06ce9f87cda9bf825ecab192b115685e629898"

[[lean_lib]]
name = "Pontryagin"
globs = ["Pontryagin"]

[lean_lib.leanOptions]
weak.linter.style.haveILetI = false
weak.linter.deprecated = false
